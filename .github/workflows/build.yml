name: build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  test-and-export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Import
        run: godot --headless --path . --import || true
      - name: Smoke test
        run: godot --headless --path . -s tests/smoke.gd
      - name: Export Web
        run: |
          # GitHub runs containers with a different HOME; point Godot at the image's export templates
          mkdir -p ~/.local/share/godot/export_templates
          [ -d ~/.local/share/godot/export_templates/4.7.2.stable ] || ln -s /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
      - name: Web build zip (for itch.io upload)
        run: cd build/web && zip -r ../last-shift-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: last-shift-web
          path: build/last-shift-web.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Export desktop builds
        run: |
          mkdir -p build/windows build/linux
          godot --headless --path . --export-release "Windows Desktop" build/windows/LastShift.exe
          godot --headless --path . --export-release "Linux" build/linux/LastShift.x86_64
          cd build && zip -r last-shift-windows.zip windows && zip -r last-shift-linux.zip linux
      - name: Publish downloads
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: On the Rocks — The Last Shift (latest build)
          body: Desktop and web builds of the current main branch. The browser version is at https://naveenrnair1988-lgtm.github.io/game-off-2026/
          files: |
            build/last-shift-windows.zip
            build/last-shift-linux.zip
            build/last-shift-web.zip
  deploy-pages:
    needs: test-and-export
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
